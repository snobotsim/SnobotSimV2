plugins {
    id 'java'
    id 'maven-publish'
}

group = 'org.snobotv2'

ext {
    baseId = "snobot_sim_java_phoenix6"
}

apply from: "${rootDir}/build_scripts/base_java.gradle"

dependencies {

    implementation wpilibJava("wpilibj")
    implementation wpilibJava("datalog")
    implementation wpilibJava("drivers")
    implementation wpilibJava("telemetry")
    implementation wpilibJava("tunables")
    implementation wpilibJava("hal")
    implementation wpilibJava("cameraserver")
    implementation wpilibJava("wpiutil")
    implementation wpilibJava("wpimath")
    implementation wpilibJava("wpiunits")
    implementation wpilibJava("ntcore")
    implementation wpilibJava("commandsv2")
    implementation project(":snobot_sim_java_base")


    implementation "com.ctre.phoenix6:wpiapi-java:${phoenix6Version}"

    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"

    testImplementation project(":snobot_sim_java_test_utils")
}

apply from: "${rootDir}/build_scripts/base_java_publish.gradle"
