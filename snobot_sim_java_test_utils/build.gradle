plugins {
    id 'java'
    id 'maven-publish'
}

group = 'org.snobotv2'

ext {
    baseId = "snobot_sim_java_test_utils"
}

apply from: "${rootDir}/build_scripts/base_java.gradle"

dependencies {
    implementation project(":snobot_sim_java_base")
    implementation wpilibJava("hal")
    implementation wpilibJava("wpilibj")
    implementation wpilibJava("datalog")
    implementation wpilibJava("drivers")
    implementation wpilibJava("telemetry")
    implementation wpilibJava("tunables")
    implementation wpilibJava("wpiutil")

    implementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    implementation "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
}

apply from: "${rootDir}/build_scripts/base_java_publish.gradle"
