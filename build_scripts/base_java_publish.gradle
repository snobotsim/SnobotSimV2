
apply plugin: 'maven-publish'


javadoc {
    source = sourceSets.main.allJava

    options.links("https://docs.oracle.com/en/java/javase/25/docs/api/")
    options.addStringOption "tag", "pre:a:Pre-Condition"
    options.addStringOption('Xdoclint:accessibility,syntax,reference,html', '-quiet')
}

tasks.register('javadocJar', Jar) {
    dependsOn javadoc
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

publishing {

    repositories {
        maven {
            url = "${rootDir}/build/maven_output"
        }
    }

    publications {

        snobot_sim_java(MavenPublication) {
            groupId = 'org.snobotv2'
            version = "${project.version}"

            artifact jar
            artifact javadocJar
            artifact sourcesJar
        }
    }
}
