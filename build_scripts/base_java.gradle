repositories {
    mavenCentral()
    mavenLocal()
    maven { url = "https://frcmaven.wpi.edu/artifactory/release/" }
    maven { url = 'https://maven.ctr-electronics.com/release/' }
    maven { url = 'https://maven.revrobotics.com/' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

ext.getCurrentArch = {
    OperatingSystem os = org.gradle.nativeplatform.platform.internal.DefaultNativePlatform.currentOperatingSystem;

    String arch = System.getProperty("os.arch");
    println(arch)

    if (os.isMacOsX()) {
        return "universal"
    }
    if (arch.equals("amd64") || arch.equals("x86_64")) {
        return "x86-64"
    }
    return "x86"
}

ext.getCurrentOs = {
    OperatingSystem os = org.gradle.nativeplatform.platform.internal.DefaultNativePlatform.currentOperatingSystem;
    println(os)
    if (os.isWindows()) {
        return "windows"
    }
    else if (os.isMacOsX()) {
        return "osx"
    }
    else {
        return "linux";
    }
}

ext {
    wpiVersion = '2027.0.0-alpha-8'
    opencvVersion = '2027-4.13.0-4'
    phoenix6Version = "26.70.0-alpha-2"
    revVersion = '2027.0.0-alpha-9'

    avajeVersion = '3.14'
    ejmlVersion = '0.46.0'
    quickbufVersion = '1.4'
    junitVersion = '5.13.4'
    junitLauncherVersion = '1.13.4'

    nativeOs = getCurrentOs() + getCurrentArch()
}

ext.wpilibJava = { String name ->
    return "org.wpilib.${name}:${name}-java:${wpiVersion}"
}

configurations {
    nativeDesktopZip
}

dependencies {
    implementation "io.avaje:avaje-jsonb:$avajeVersion"
    implementation "org.ejml:ejml-java9module:$ejmlVersion"
    implementation "us.hebi.quickbuf:quickbuf-runtime:$quickbufVersion"

    testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junitLauncherVersion"

    for (String lib : [
        "hal",
        "ntcore",
        "wpinet",
        "wpiutil",
        "wpimath",
        "cscore",
        "cameraserver",
        "datalog",
        "telemetry",
        "tunables",
        "drivers",
        "commandsv2"
    ]) {
        nativeDesktopZip "org.wpilib.${lib}:${lib}-cpp:${wpiVersion}:${nativeOs}@zip"
    }
    nativeDesktopZip "org.wpilib.thirdparty.opencv:opencv-cpp:${opencvVersion}:${nativeOs}@zip"

    nativeDesktopZip "com.ctre.phoenix6.sim:api-cpp-sim:${phoenix6Version}:${nativeOs}@zip"
    nativeDesktopZip "com.ctre.phoenix6.sim:simProCANrange:${phoenix6Version}:${nativeOs}@zip"
    nativeDesktopZip "com.ctre.phoenix6.sim:simProCANdi:${phoenix6Version}:${nativeOs}@zip"
    nativeDesktopZip "com.ctre.phoenix6.sim:simProCANdle:${phoenix6Version}:${nativeOs}@zip"
    nativeDesktopZip "com.ctre.phoenix6.sim:simPigeonIMU:${phoenix6Version}:${nativeOs}@zip"
    nativeDesktopZip "com.ctre.phoenix6.sim:simProCANcoder:${phoenix6Version}:${nativeOs}@zip"
    nativeDesktopZip "com.ctre.phoenix6.sim:simProPigeon2:${phoenix6Version}:${nativeOs}@zip"
    nativeDesktopZip "com.ctre.phoenix6.sim:simProTalonFX:${phoenix6Version}:${nativeOs}@zip"
    nativeDesktopZip "com.ctre.phoenix6.sim:simProTalonFXS:${phoenix6Version}:${nativeOs}@zip"
    nativeDesktopZip "com.ctre.phoenix6.sim:simTalonSRX:${phoenix6Version}:${nativeOs}@zip"
    nativeDesktopZip "com.ctre.phoenix6.sim:simVictorSPX:${phoenix6Version}:${nativeOs}@zip"
    nativeDesktopZip "com.ctre.phoenix6.sim:tools-sim:${phoenix6Version}:${nativeOs}@zip"

    nativeDesktopZip "com.revrobotics.frc:REVLib-driver:${revVersion}:${nativeOs}@zip"
    nativeDesktopZip "com.revrobotics.frc:RevLibBackendDriver:${revVersion}:${nativeOs}@zip"
    nativeDesktopZip "com.revrobotics.frc:RevLibWpiBackendDriver:${revVersion}:${nativeOs}@zip"
}

tasks.withType(JavaCompile) {
    options.deprecation = true
}

def extractJniLibraries = tasks.register('extractJniLibraries', Sync) {
    def nativeZips = configurations.nativeDesktopZip
    from({ nativeZips.collect { zipTree(it) } }) {
        include '**/*.so*'
        include '**/*.dll'
        include '**/*.dylib'
        eachFile { FileCopyDetails details -> details.path = details.name }
    }
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    into layout.buildDirectory.dir("snobotSimFiles")
}


apply from: "${rootDir}/styleguide/styleguide.gradle"

test {
    systemProperty "java.library.path", "${projectDir}/build/snobotSimFiles"
    environment 'LD_LIBRARY_PATH', "${projectDir}/build/snobotSimFiles"
    workingDir "${projectDir}/build/snobotSimFiles"
    dependsOn(extractJniLibraries)

    useJUnitPlatform {
        // TODO ctre exclusion is temporary while they fix up their beta
        excludeTags "flaky", "ctre"

    }
    testLogging {
        events "failed", "STANDARD_OUT"
        exceptionFormat "full"
    }
    finalizedBy jacocoTestReport
}
